# Balorg AI Configuration
# Model configuration for different sizes

# Small model configuration
small_model:
  vocab_size: 50257
  hidden_size: 384
  num_layers: 6
  num_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 1024
  dropout_prob: 0.1
  layer_norm_eps: 1.0e-5

# Base model configuration
base_model:
  vocab_size: 50257
  hidden_size: 768
  num_layers: 12
  num_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 2048
  dropout_prob: 0.1
  layer_norm_eps: 1.0e-5

# Large model configuration
large_model:
  vocab_size: 50257
  hidden_size: 1024
  num_layers: 24
  num_heads: 16
  intermediate_size: 4096
  max_position_embeddings: 2048
  dropout_prob: 0.1
  layer_norm_eps: 1.0e-5

# Training configuration
training:
  output_dir: "./outputs"
  num_epochs: 3
  batch_size: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  save_steps: 1000
  logging_steps: 100
  eval_steps: 1000
  mixed_precision: true

# Generation parameters
generation:
  max_length: 100
  temperature: 0.9
  top_k: 50
  top_p: 0.95
  repetition_penalty: 1.0
